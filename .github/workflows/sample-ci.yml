name: Sample CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r starters/week-3/app/requirements.txt || true
      - name: Run sample app lint/test
        run: |
          echo "No tests included in starter; replace with real tests"
      - name: Build Docker image (optional)
        run: |
          docker build -t onboarding-sample:latest starters/week-3/app || true
